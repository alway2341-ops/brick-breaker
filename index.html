<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>벽돌 깨기 게임</title>
    <style>
        canvas { background: #f0f0f0; display: block; margin: 0 auto; border: 4px solid #333; cursor: none; }
        body { background: #222; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    </style>
</head>
<body>
<canvas id="myCanvas" width="480" height="400"></canvas>
<script>
    var canvas = document.getElementById("myCanvas"), ctx = canvas.getContext("2d");
    var paddleWidth = 100, paddleX = 190, mouseX = 240, running = true;
    var balls = [{ x: 240, y: 370, dx: 1.8, dy: -1.8, radius: 8, baseRadius: 8 }];
    var bricks = [], score = 0, lastTime = performance.now();

    function movePaddle(e) {
        var rect = canvas.getBoundingClientRect();
        mouseX = (e.clientX || e.touches[0].clientX) - rect.left;
    }
    canvas.addEventListener("mousemove", movePaddle);
    canvas.addEventListener("touchmove", movePaddle, { passive: false });

    function gameLoop(timestamp) {
        var deltaTime = (timestamp - lastTime) / 16.67;
        lastTime = timestamp;
        ctx.clearRect(0, 0, 480, 400);

        paddleX = mouseX - paddleWidth / 2;
        ctx.fillStyle = "#34495e";
        ctx.fillRect(paddleX, 390, paddleWidth, 10);

        if (Math.random() < 0.015) {
            let type = Math.random() < 0.1 ? 4 : (Math.random() < 0.3 ? 3 : 0);
            bricks.unshift({ x: Math.random() * 420, y: 0, type: type, speed: 0.5 + Math.random() * 0.5, passed: false });
        }

        bricks.forEach((b, i) => {
            b.y += 1 * b.speed * deltaTime;
            ctx.fillStyle = (b.type === 4) ? "rgba(231, 76, 60, 0.5)" : (b.type === 3 ? "#3498db" : "#e74c3c");
            ctx.fillRect(b.x, b.y, 50, 20);

            balls.forEach(ball => {
                if (ball.x > b.x && ball.x < b.x + 50 && ball.y > b.y && ball.y < b.y + 20) {
                    if (b.type === 4) { if (!b.passed) { ball.dx *= 1.5; b.passed = true; } }
                    else {
                        if (b.type === 3) {
                            balls.forEach(b => b.radius = 4);
                            setTimeout(() => balls.forEach(b => b.radius = b.baseRadius), 3000);
                        }
                        bricks.splice(i, 1); score++;
                    }
                }
            });
            if (b.y > 400) { alert("Game Over! Score: " + score); location.reload(); }
        });

        balls.forEach((ball, i) => {
            ball.x += ball.dx * deltaTime;
            ball.y += ball.dy * deltaTime;
            if (ball.x > 470 || ball.x < 10) ball.dx *= -1;
            if (ball.y < 10) ball.dy *= -1;
            if (ball.y > 385 && ball.x > paddleX && ball.x < paddleX + paddleWidth) ball.dy = -Math.abs(ball.dy);
            
            ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2); ctx.fillStyle = "gold"; ctx.fill();
            if (ball.y > 450) { balls.splice(i, 1); if(balls.length === 0) location.reload(); }
        });

        ctx.fillStyle = "black"; ctx.fillText("Score: " + score, 10, 20);
        requestAnimationFrame(gameLoop);
    }
    requestAnimationFrame(gameLoop);
</script>
</body>
</html>
