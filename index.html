<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>벽돌 깨기 - 핵심 로직 전용</title>
    <style>
        body { margin: 0; background: #222; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        canvas { background: #f0f0f0; border: 4px solid #333; display: block; }
        #startScreen { position: absolute; background: rgba(0,0,0,0.8); color: white; padding: 20px; cursor: pointer; border-radius: 10px; z-index: 10; font-family: sans-serif; }
    </style>
</head>
<body>
    <div id="startScreen"><h1>클릭하여 게임 시작</h1></div>
    <canvas id="myCanvas" width="480" height="400"></canvas>

    <script>
        const canvas = document.getElementById("myCanvas");
        const ctx = canvas.getContext("2d");
        const startScreen = document.getElementById("startScreen");

        let balls = [], bricks = [], score = 0, running = false, paddleX = 190, paddleWidth = 100;

        function initGame() {
            score = 0;
            // 공 초기 위치 및 속도 설정
            balls = [{ x: 240, y: 100, dx: 3, dy: 3, radius: 8 }];
            bricks = [];
            running = true;
        }

        startScreen.addEventListener('click', () => {
            if (running) return;
            startScreen.style.display = 'none';
            initGame();
            gameLoop();
        });

        canvas.addEventListener("mousemove", (e) => { 
            const rect = canvas.getBoundingClientRect();
            paddleX = Math.max(0, Math.min(480 - paddleWidth, (e.clientX - rect.left) - paddleWidth / 2));
        });

        function gameLoop() {
            if (!running) return;

            ctx.clearRect(0, 0, 480, 400);

            // 1. 블록 생성 (확률)
            if (Math.random() < 0.02) {
                bricks.push({ x: Math.random() * 420, y: 0 });
            }

            // 2. 블록 이동 및 그리기
            for (let i = bricks.length - 1; i >= 0; i--) {
                bricks[i].y += 2; // 블록 속도
                ctx.fillStyle = "red";
                ctx.fillRect(bricks[i].x, bricks[i].y, 50, 20);

                // 블록이 화면 아래로 나가면 삭제
                if (bricks[i].y > 400) bricks.splice(i, 1);
            }

            // 3. 공 로직 (이동, 충돌, 삭제)
            balls = balls.filter(ball => {
                ball.x += ball.dx;
                ball.y += ball.dy;

                // 벽 충돌
                if (ball.x < 0 || ball.x > 480) ball.dx = -ball.dx;
                if (ball.y < 0) ball.dy = -ball.dy;

                // 패들 충돌 (y=390 기준)
                if (ball.y > 380 && ball.y < 390 && ball.x > paddleX && ball.x < paddleX + paddleWidth) {
                    ball.dy = -Math.abs(ball.dy);
                }

                // 공-블록 충돌
                bricks.forEach((b, index) => {
                    if (ball.x > b.x && ball.x < b.x + 50 && ball.y > b.y && ball.y < b.y + 20) {
                        ball.dy = -ball.dy;
                        bricks.splice(index, 1);
                        score++;
                    }
                });

                // 게임 종료 조건: 공이 400을 넘으면 삭제 (배열에서 제거)
                return ball.y < 400;
            });

            // 4. 그리기
            balls.forEach(b => {
                ctx.fillStyle = "blue";
                ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI*2); ctx.fill();
            });
            ctx.fillStyle = "black";
            ctx.fillRect(paddleX, 390, paddleWidth, 10);
            ctx.fillText("Score: " + score, 10, 20);

            // 5. 게임 오버 체크
            if (balls.length === 0) {
                running = false;
                startScreen.style.display = 'block';
                startScreen.innerHTML = `<h1>Game Over! 점수: ${score}</h1><p>클릭하여 재시작</p>`;
            } else {
                requestAnimationFrame(gameLoop);
            }
        }
    </script>
</body>
</html>
