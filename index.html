<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>벽돌 깨기 - 최종 보정판</title>
    <style>
        body { margin: 0; background: #222; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        canvas { background: #f0f0f0; border: 4px solid #333; display: block; }
        #startScreen { position: absolute; background: rgba(0,0,0,0.8); color: white; padding: 20px; cursor: pointer; border-radius: 10px; z-index: 10; font-family: sans-serif; }
    </style>
</head>
<body>
    <div id="startScreen"><h1>클릭하여 게임 시작</h1></div>
    <canvas id="myCanvas" width="480" height="400"></canvas>

    <script>
        const canvas = document.getElementById("myCanvas");
        const ctx = canvas.getContext("2d");

        // 오디오 로딩 (에러 방지)
        const loadAudio = (src) => {
            try { return new Audio(src); } catch(e) { return { play: () => {}, pause: () => {}, currentTime: 0 }; }
        };
        const breakSound = loadAudio('break.wav');
        const bgm = loadAudio('bgm.wav'); bgm.loop = true;

        // 게임 변수
        let balls = [{ x: 240, y: 100, dx: 2, dy: 3, radius: 8 }];
        let bricks = [];
        let particles = [];
        let score = 0;
        let running = false;
        let paddleX = 190;
        let paddleWidth = 100;
        
        // 초기값: 초반 속도 1.2 유지
        let blockBaseSpeed = 1.2; 

        document.getElementById('startScreen').addEventListener('click', function() {
            this.style.display = 'none';
            bgm.play().catch(e => console.log("오디오 재생 실패"));
            running = true;
            gameLoop();
        });

        canvas.addEventListener("mousemove", (e) => { 
            const rect = canvas.getBoundingClientRect();
            paddleX = (e.clientX - rect.left) - paddleWidth / 2;
        });

        function createParticles(x, y, color) {
            for(let i = 0; i < 15; i++) {
                particles.push({ 
                    x: x, y: y, 
                    dx: (Math.random() - 0.5) * 6, 
                    dy: (Math.random() - 0.5) * 6, 
                    radius: 2, 
                    color: color, 
                    life: 20 
                });
            }
        }

        function gameLoop() {
            if (!running) return;
            ctx.clearRect(0, 0, 480, 400);

            // [1] 속도 증가 로직: 30점마다 블록 속도 증가
            blockBaseSpeed = 1.2 + Math.floor(score / 30) * 0.3;

            // [2] 블록 생성 로직
            if (Math.random() < 0.02) {
                let r = Math.random();
                let type = (score >= 50 && r < 0.1) ? 5 : (r < 0.2 ? 2 : (r < 0.4 ? 1 : 0));
                bricks.push({ x: Math.random() * 420, y: 0, type: type, speed: blockBaseSpeed });
            }

            // [3] 블록 그리기 및 정밀 충돌 판정
            let toRemove = [];
            for (let i = 0; i < bricks.length; i++) {
                let b = bricks[i];
                b.y += b.speed;
                
                if (b.type === 5) ctx.fillStyle = "#87CEEB";
                else if (b.type === 2) ctx.fillStyle = "black";
                else if (b.type === 1) ctx.fillStyle = "#2ecc71";
                else ctx.fillStyle = "#e74c3c";
                
                ctx.fillRect(b.x, b.y, 50, 20);

                balls.forEach(ball => {
                    let closestX = Math.max(b.x, Math.min(ball.x, b.x + 50));
                    let closestY = Math.max(b.y, Math.min(ball.y, b.y + 20));
                    let distance = Math.hypot(ball.x - closestX, ball.y - closestY);
