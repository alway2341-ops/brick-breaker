<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>벽돌 깨기 - 최종 통합본</title>
    <style>
        body { margin: 0; background: #222; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        canvas { background: #f0f0f0; border: 4px solid #333; display: block; }
        #startScreen { position: absolute; background: rgba(0,0,0,0.8); color: white; padding: 20px; cursor: pointer; border-radius: 10px; z-index: 10; font-family: sans-serif; }
    </style>
</head>
<body>
    <div id="startScreen"><h1>클릭하여 게임 시작</h1></div>
    <canvas id="myCanvas" width="480" height="400"></canvas>

    <script>
        const canvas = document.getElementById("myCanvas");
        const ctx = canvas.getContext("2d");

        const loadAudio = (src) => {
            try { return new Audio(src); } catch(e) { return { play: () => {}, pause: () => {}, currentTime: 0 }; }
        };
        const breakSound = loadAudio('break.wav');
        const bgm = loadAudio('bgm.wav'); bgm.loop = true;

        let balls = [{ x: 240, y: 100, dx: 2, dy: 3, radius: 8, originalRadius: 8, growTime: 0 }];
        let bricks = [];
        let particles = [];
        let score = 0;
        let running = false;
        let paddleX = 190, paddleWidth = 100;
        let blockBaseSpeed = 1.2;
        let rotationAngle = 0; // 노란색 블록 회전각

        document.getElementById('startScreen').addEventListener('click', function() {
            this.style.display = 'none';
            bgm.play().catch(e => {});
            running = true;
            gameLoop();
        });

        canvas.addEventListener("mousemove", (e) => { 
            const rect = canvas.getBoundingClientRect();
            paddleX = (e.clientX - rect.left) - paddleWidth / 2;
        });

        function createParticles(x, y, color) {
            for(let i = 0; i < 15; i++) {
                particles.push({ x, y, dx: (Math.random()-0.5)*6, dy: (Math.random()-0.5)*6, radius: 2, color, life: 20 });
            }
        }

        function gameLoop() {
            if (!running) return;
            ctx.clearRect(0, 0, 480, 400);

            blockBaseSpeed = 1.2 + Math.floor(score / 30) * 0.3;

            // 1. 블록 생성 로직
            if (Math.random() < 0.02) {
                let r = Math.random();
                let type;
                if (score >= 500 && r < 0.05) type = 6; // 노란색 회전
                else if (score >= 50 && r < 0.1) type = 5; // 하늘색
                else if (r < 0.2) type = 2; // 검정색
                else if (r < 0.4) type = 1; // 초록색
                else type = 0; // 빨간색

                // 노란색 블록은 원형 궤적을 위한 초기 위치 설정
                if (type === 6) bricks.push({ x: 240, y: 150, type: 6, angle: 0, speed: blockBaseSpeed * 0.5 });
                else bricks.push({ x: Math.random() * 420, y: 0, type: type, speed: blockBaseSpeed });
            }

            // 2. 블록 업데이트 및 충돌
            let toRemove = [];
            for (let i = 0; i < bricks.length; i++) {
                let b = bricks[i];
                
                // 노란색 블록: 원형 회전 이동
                if (b.type === 6) {
                    b.angle += b.speed * 0.02;
                    b.x = 240 + Math.cos(b.angle) * 100 - 25;
                    b.y = 150 + Math.sin(b.angle) * 80 - 10;
                    ctx.fillStyle = "gold";
                } else {
                    b.y += b.speed;
                    if (b.type === 5) ctx.fillStyle = "#87CEEB";
                    else if (b.type === 2) ctx.fillStyle = "black";
                    else if (b.type === 1) ctx.fillStyle = "#2ecc71";
                    else ctx.fillStyle = "#e74c3c";
                }
                
                ctx.fillRect(b.x, b.y, 50, 20);

                // 공과의 정밀 충돌 판정
                balls.forEach(ball => {
                    let closestX = Math.max(b.x, Math.min(ball.x, b.x + 50));
                    let closestY = Math.max(b.y, Math.min(ball.y, b.y + 20));
                    if (Math.hypot(ball.x - closestX, ball.y - closestY) < ball.radius) {
                        if (Math.abs(ball.x - closestX) > Math.abs(ball.y - closestY)) ball.dx = -ball.dx;
                        else ball.dy = -ball.dy;
                        
                        if (b.type === 6) { // 노란색: 공 크기 증가
                            ball.radius = ball.originalRadius * 2;
                            ball.growTime = 100; // 100프레임 유지
                            createParticles(b.x + 25, b.y + 10, "gold");
                            toRemove.push(i);
                        } else if (b.type === 5) ball.dx = (Math.random() - 0.5) * 10;
                        else if (b.type === 2) {
                            bricks = bricks.filter(br => br.type !== 6 && Math.hypot(br.x - b.x, br.y - b.y) > 80);
                            createParticles(b.x + 25, b.y + 10, "#555");
                        } else if (b.type === 1) {
                            balls.push({ x: ball.x, y: ball.y, dx: -ball.dx, dy: -ball.dy, radius: ball.originalRadius, originalRadius: 8, growTime: 0 });
                            toRemove.push(i); createParticles(b.x + 25, b.y + 10, "#2ecc71");
                        } else {
                            toRemove.push(i); createParticles(b.x + 25, b.y + 10, "#e74c3c");
                        }
                        score += (b.type === 6 ? 10 : 1);
                        breakSound.currentTime = 0; breakSound.play().catch(e => {});
                    }
                });
            }
            toRemove.sort((a,b) => b-a).forEach(i => bricks.splice(i, 1));

            // 3. 파티클 및 공 업데이트
            particles.forEach((p, i) => {
                p.x += p.dx; p.y += p.dy; p.life--;
                if (p.life <= 0) particles.splice(i, 1);
                else { ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fillStyle = p.color; ctx.fill(); }
            });

            balls.forEach(ball => {
                ball.x += ball.dx;
                ball.y += ball.dy;

                // 노란색 효과: 공 크기 복구 로직
                if (ball.growTime > 0) {
                    ball.growTime--;
                    if (ball.growTime <= 0) ball.radius = ball.originalRadius;
                }

                if (ball.x < 0 || ball.x > 480) ball.dx = -ball.dx;
                if (ball.y < 0) ball.dy = -ball.dy;
                
                // 받침대 충돌 안전장치 (속도 상한선 제거)
                if (ball.dy > 0 && ball.y > 380 && ball.y < 390 && ball.x > paddleX && ball.x < paddleX + paddleWidth) {
                    let paddleSpeedMult = 1 + Math.floor(score / 30) * 0.1;
                    ball.dx = ((ball.x - (paddleX + paddleWidth / 2)) / (paddleWidth / 2)) * 5 * paddleSpeedMult;
                    ball.dy = -Math.abs(ball.dy) * paddleSpeedMult;
                    ball.y = 380 - ball.radius; // 위치 강제 보정
                }
                
                ctx.beginPath(); 
                ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2); 
                ctx.fillStyle = "gold"; ctx.fill();
            });

            if (balls.length === 0) {
                running = false;
                alert("Game Over! Score: " + score);
                location.reload();
            }

            ctx.fillStyle = "black";
            ctx.fillText("Score: " + score, 10, 20);
            ctx.fillStyle = "#34495e";
            ctx.fillRect(paddleX, 390, paddleWidth, 10);
            
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
