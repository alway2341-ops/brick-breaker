<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>벽돌 깨기 게임</title>
    <style>
        body { margin: 0; background: #222; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; touch-action: none; }
        #gameContainer { position: relative; width: 100vw; max-width: 480px; height: 400px; }
        canvas { background: #f0f0f0; border: 4px solid #333; display: block; width: 100%; height: 100%; cursor: none; }
        #startScreen { position: absolute; top:0; left:0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; z-index: 10; }
        button { padding: 15px 30px; font-size: 20px; cursor: pointer; border-radius: 8px; border: none; }
    </style>
</head>
<body>
<div id="gameContainer">
    <canvas id="myCanvas" width="480" height="400"></canvas>
    <div id="startScreen">
        <h1>벽돌 깨기</h1>
        <button onclick="startGame()">게임 시작</button>
    </div>
</div>

<script>
    var canvas = document.getElementById("myCanvas"), ctx = canvas.getContext("2d");
    var paddleWidth = 100, paddleX = 190, mouseX = 240, running = false;
    var balls = [{ x: 240, y: 370, dx: 1.8, dy: -1.8, radius: 8 }];
    var bricks = [], particles = [], score = 0, flash = 0;
    var brickSpeedBase = 0.5; 

    const breakSound = new Audio('break.wav');
    const bgm = new Audio('bgm.wav');
    bgm.loop = true; bgm.volume = 0.5;

    function startGame() {
        breakSound.load();
        bgm.play().catch(e => console.log("BGM 대기"));
        document.getElementById('startScreen').style.display = 'none';
        running = true;
        gameLoop();
    }

    function movePaddle(e) {
        var rect = canvas.getBoundingClientRect();
        var clientX = e.touches ? e.touches[0].clientX : e.clientX;
        mouseX = clientX - rect.left;
    }
    canvas.addEventListener("mousemove", movePaddle);
    canvas.addEventListener("touchmove", movePaddle, { passive: false });

    function gameLoop() {
        if(!running) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if(flash > 0) { ctx.fillStyle = "rgba(255,255,255,0.5)"; ctx.fillRect(0,0,canvas.width,canvas.height); flash--; }
        
        paddleX = mouseX - paddleWidth/2;
        ctx.fillStyle = "#34495e";
        ctx.fillRect(paddleX, 390, paddleWidth, 10);

        if(Math.random() < 0.015) {
            bricks.unshift({ x: Math.random() * 420, y: 0, type: Math.random() < 0.1 ? 2 : (Math.random() < 0.3 ? 1 : 0), speed: 0.2 + Math.random() * 0.6 });
        }

        // 파티클 업데이트 및 그리기
        particles.forEach((p, i) => { p.x += p.dx; p.y += p.dy; p.life--; ctx.fillStyle="red"; ctx.fillRect(p.x, p.y, 3, 3); if(p.life <= 0) particles.splice(i, 1); });

        bricks.forEach((b, i) => {
            b.y += (brickSpeedBase + (score * 0.0005)) * b.speed;
            ctx.fillStyle = b.type === 2 ? "black" : (b.type === 1 ? "#2ecc71" : "#e74c3c");
            ctx.fillRect(b.x, b.y, 50, 20);
            
            balls.forEach(ball => {
                if(ball.x > b.x && ball.x < b.x+50 && ball.y > b.y && ball.y < b.y+20) {
                    breakSound.currentTime = 0;
                    breakSound.play().catch(e => {});
                    
                    // 폭발/공 생성 로직
                    if(b.type === 2) { bricks = bricks.filter(br => Math.hypot(br.x - b.x, br.y - b.y) > 80); flash = 10; }
                    else if(b.type === 1) balls.push({ x: ball.x, y: ball.y, dx: -ball.dx, dy: -ball.dy, radius: 8 });
                    
                    // 파티클 생성
                    for(let k=0; k<10; k++) particles.push({x:b.x+25, y:b.y+10, dx:(Math.random()-0.5)*6, dy:(Math.random()-0.5)*6, life:20});
                    
                    ball.dy = -ball.dy; bricks.splice(i, 1); score++;
                }
            });
            if(b.y > 400) { running = false; bgm.pause(); alert("Game Over! Score: " + score); location.reload(); }
        });

        balls.forEach((ball, i) => {
            ball.x += ball.dx * (1 + score * 0.005);
            ball.y += ball.dy * (1 + score * 0.005);
            if(ball.x > 470 || ball.x < 10) ball.dx = -ball.dx;
            if(ball.y < 10) ball.dy = -ball.dy;
            if(ball.y > 385 && ball.x > paddleX - 5 && ball.x < paddleX + paddleWidth + 5) {
                var paddleCenter = paddleX + paddleWidth / 2;
                var dist = ball.x - paddleCenter;
                ball.dy =
