<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>벽돌 깨기 게임</title>
    <style>
        body { margin: 0; background: #222; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        canvas { background: #f0f0f0; border: 4px solid #333; }
        #startScreen { position: absolute; background: rgba(0,0,0,0.8); color: white; padding: 20px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="startScreen"><h1>클릭하여 시작</h1></div>
    <canvas id="myCanvas" width="480" height="400"></canvas>

    <script>
        const canvas = document.getElementById("myCanvas"), ctx = canvas.getContext("2d");
        let balls = [], bricks = [], score = 0, running = false;
        const breakSound = new Audio('break.wav');
        const bgm = new Audio('bgm.wav'); bgm.loop = true;

        document.getElementById('startScreen').addEventListener('click', function() {
            this.style.display = 'none';
            bgm.play().catch(e => console.log("BGM 재생 대기"));
            balls = [{ x: 240, y: 370, dx: 2, dy: -2, radius: 8 }];
            bricks = []; score = 0; running = true;
            requestAnimationFrame(gameLoop);
        });

        function gameLoop() {
            if (!running) return;
            ctx.clearRect(0, 0, 480, 400);

            // 블록 생성
            if (Math.random() < 0.02) {
                bricks.push({ x: Math.random() * 420, y: 0, type: Math.random() < 0.2 ? 1 : 0, speed: 1 });
            }

            // 블록 이동 및 충돌
            let toRemove = [];
            bricks.forEach((b, i) => {
                b.y += b.speed;
                ctx.fillStyle = b.type === 1 ? "#2ecc71" : "#e74c3c";
                ctx.fillRect(b.x, b.y, 50, 20);

                balls.forEach(ball => {
                    if (ball.x > b.x && ball.x < b.x + 50 && ball.y > b.y && ball.y < b.y + 20) {
                        breakSound.currentTime = 0;
                        breakSound.play().catch(e => console.log("소리 재생 실패"));
                        
                        if (b.type === 1) balls.push({ x: ball.x, y: ball.y, dx: -ball.dx, dy: -ball.dy, radius: 8 });
                        
                        ball.dy = -ball.dy;
                        toRemove.push(i);
                        score++;
                    }
                });
            });

            toRemove.sort((a,b) => b-a).forEach(i => bricks.splice(i, 1));

            // 공 이동
            balls = balls.filter(ball => {
                ball.x += ball.dx; ball.y += ball.dy;
                if (ball.x < 0 || ball.x > 480) ball.dx = -ball.dx;
                if (ball.y < 0) ball.dy = -ball.dy;
                ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI*2); ctx.fillStyle = "gold"; ctx.fill();
                return ball.y < 400; // 화면 밖으로 나가면 제거
            });

            // 게임 오버 조건: 공이 하나도 없을 때
            if (balls.length === 0) {
                running = false;
                alert("Game Over! Score: " + score);
                location.reload();
            }

            ctx.fillStyle = "black"; ctx.fillText("Score: " + score, 10, 20);
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
