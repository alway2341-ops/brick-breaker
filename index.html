<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>벽돌 깨기 - 최종 통합 버전</title>
    <style>
        /* 화면 정렬 및 스크롤 방지 CSS */
        html, body { 
            margin: 0; padding: 0; 
            width: 100%; height: 100%; 
            background: #222; 
            display: flex; justify-content: center; align-items: center; 
            overflow: hidden; touch-action: none; 
        }
        canvas { 
            background: #f0f0f0; 
            border: 4px solid #333; 
            display: block; 
            width: 90%; /* 화면 비율 약간 확대 */
            max-width: 540px; 
            aspect-ratio: 480 / 400; /* 비율 유지 */
            touch-action: none;
        }
        #startScreen { 
            position: absolute; background: rgba(0,0,0,0.8); color: white; padding: 20px; 
            border-radius: 10px; z-index: 10; font-family: sans-serif; text-align: center; width: 80%; max-width: 300px;
        }
        button { margin: 10px 0; padding: 15px; cursor: pointer; border-radius: 5px; border: none; font-weight: bold; width: 100%; font-size: 16px; }
        .normal-btn { background-color: #2ecc71; color: white; }
        .extreme-btn { background-color: #e74c3c; color: white; }
    </style>
</head>
<body>
    <div id="startScreen">
        <h1>벽돌 깨기</h1>
        <button id="normalBtn" class="normal-btn">일반 모드</button>
        <button id="extremeBtn" class="extreme-btn">극한 모드</button>
    </div>
    <canvas id="myCanvas" width="480" height="400"></canvas>

    <script>
        const canvas = document.getElementById("myCanvas");
        const ctx = canvas.getContext("2d");
        const startScreen = document.getElementById("startScreen");
        const normalBtn = document.getElementById("normalBtn");
        const extremeBtn = document.getElementById("extremeBtn");

        const breakSound = new Audio('break.wav');
        const bgm = new Audio('bgm.wav');
        bgm.loop = true;

        let balls = [], bricks = [], particles = [], score = 0, running = false, paddleX = 190, paddleWidth = 100, blockBaseSpeed = 1.2;
        let gameMode = 'normal';

        function startGame(mode) {
            if (running) return;
            gameMode = mode;
            score = 0;
            balls = [{ x: 240, y: 100, dx: 2, dy: 3, radius: 8 }];
            bricks = [];
            particles = [];
            paddleX = 190;
            blockBaseSpeed = 1.2;
            running = true;
            startScreen.style.display = 'none';
            
            // 오디오 재생
            bgm.play().catch(e => console.log("BGM 재생 대기"));
            
            gameLoop();
        }

        normalBtn.addEventListener('click', () => startGame('normal'));
        extremeBtn.addEventListener('click', () => startGame('extreme'));

        // 패들 이동 최적화
        function movePaddle(clientX) {
            const rect = canvas.getBoundingClientRect();
            // 화면 스케일 비율 계산
            const scaleX = canvas.width / rect.width;
            const mouseX = (clientX - rect.left) * scaleX;
            paddleX = Math.max(0, Math.min(480 - paddleWidth, mouseX - paddleWidth / 2));
        }

        canvas.addEventListener("mousemove", (e) => movePaddle(e.clientX));
        canvas.addEventListener("touchmove", (e) => {
            if (e.cancelable) e.preventDefault();
            movePaddle(e.touches[0].clientX);
        }, { passive: false });

        function createParticles(x, y, color) {
            for(let i = 0; i < 15; i++) {
                particles.push({ x, y, dx: (Math.random()-0.5)*6, dy: (Math.random()-0.5)*6, radius: 2, color, life: 20 });
            }
        }

        function gameLoop() {
            if (!running) return;
            ctx.clearRect(0, 0, 480, 400);

            let increment = (gameMode === 'extreme') ? 0.3 : 0.1;
            let interval = (gameMode === 'extreme') ? 50 : 100;
            blockBaseSpeed = 1.2 + Math.floor(score / interval) * increment;

            if (Math.random() < 0.02) {
                let r = Math.random();
                let type = (score >= 200 && r < 0.05) ? 6 : (score >= 100 && r < 0.15 ? 5 : (r < 0.25 ? 2 : (r < 0.45 ? 1 : 0)));
                let b = { x: Math.random() * 420, y: 0, type: type, speed: blockBaseSpeed };
                if (type === 6) { b.rotAngle = 0; b.rotRadius = 50 + Math.random() * 100; b.center = { x: Math.random() * 400 + 40, y: Math.random() * 100 + 30 }; }
                bricks.push(b);
            }

            let toRemove = [];
            for (let i = 0; i < bricks.length; i++) {
                let b = bricks[i];
                if (b.type === 6) { b.rotAngle += 0.02 * b.speed; b.x = b.center.x + Math.cos(b.rotAngle) * b.rotRadius; b.y = b.center.y + Math.sin(b.rotAngle) * b.rotRadius; }
                else { b.y += b.speed; }
                
                ctx.fillStyle = b.type === 6 ? "orange" : (b.type === 5 ? "#87CEEB" : (b.type === 2 ? "black" : (b.type === 1 ? "#2ecc71" : "#e74c3c")));
                ctx.fillRect(b.x, b.y, 50, 20);

                balls.forEach(ball => {
                    let closestX = Math.max(b.x, Math.min(ball.x, b.x + 50));
                    let closestY = Math.max(b.y, Math.min(ball.y, b.y + 20));
                    if (Math.hypot(ball.x - closestX, ball.y - closestY) < ball.radius) {
                        breakSound.currentTime = 0;
                        breakSound.play().catch(e => {});

                        if (b.type === 5) {
                            ball.radius = Math.max(3, ball.radius - 2);
                            toRemove.push(i);
                        } else {
                            if (Math.abs(ball.x - closestX) > Math.abs(ball.y - closestY)) ball.dx = -ball.dx;
                            else ball.dy = -ball.dy;
                            
                            if (b.type === 6) { createParticles(b.x + 25, b.y + 10, "orange"); score += 5; toRemove.push(i); }
                            else if (b.type === 2) { 
                                let before = bricks.length;
                                bricks = bricks.filter(br => Math.hypot(br.x - b.x, br.y - b.y) > 80);
                                score += (before - bricks.length);
                                createParticles(b.x + 25, b.y + 10, "#555");
                            } else if (b.type === 1) { balls.push({ x: ball.x, y: ball.y, dx: -ball.dx, dy: -ball.dy, radius: ball.radius }); toRemove.push(i); createParticles(b.x + 25, b.y + 10, "#2ecc71"); score++; }
                            else { toRemove.push(i); createParticles(b.x + 25, b.y + 10, "#e74c3c"); score++; }
                        }
                    }
                });
            }
            toRemove.sort((a,b) => b-a).forEach(i => bricks.splice(i, 1));

            particles.forEach((p, i) => { p.x += p.dx; p.y += p.dy; p.life--; if (p.life <= 0) particles.splice(i, 1); else { ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fillStyle = p.color; ctx.fill(); } });

            let activeBalls = [];
            balls.forEach(ball => {
                ball.x += ball.dx; ball.y += ball.dy;
                if (ball.x < 0 || ball.x > 480) ball.dx = -ball.dx;
                if (ball.y < 0) ball.dy = -ball.dy;
                
                if (ball.dy > 0 && ball.y + ball.radius >= 390 && ball.y + ball.radius <= 400 && ball.x > paddleX && ball.x < paddleX + paddleWidth) {
                    let mult = (gameMode === 'extreme') ? (1 + Math.floor(score / 50) * 0.1) : (1 + Math.floor(score / 200) * 0.05);
                    ball.dx = ((ball.x - (paddleX + paddleWidth / 2)) / (paddleWidth / 2)) * 5 * mult;
                    ball.dy = -Math.abs(ball.dy) * mult;
                    ball.y = 390 - ball.radius;
                }

                // 속도 제한: 일반 모드에서만 적용 (극한 모드는 제한 없음)
                if
