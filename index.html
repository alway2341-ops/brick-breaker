<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>벽돌 깨기 게임</title>
    <style>

        #gameContainer { position: relative; width: 100vw; max-width: 480px; height: 400px; }
        canvas { background: #f0f0f0; border: 4px solid #333; display: block; width: 100%; height: 100%; cursor: none; }
        #startScreen { position: absolute; top:0; left:0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; z-index: 10; }
        button { padding: 15px 30px; font-size: 20px; cursor: pointer; border-radius: 8px; border: none; }
    </style>
</head>
<body>
<div id="gameContainer">
    <canvas id="myCanvas" width="480" height="400"></canvas>
    <div id="startScreen">
        <h1>벽돌 깨기</h1>
        <button onclick="startGame()">게임 시작</button>
    </div>
</div>

    const breakSound = new Audio('break.wav');
    const bgm = new Audio('bgm.wav');

    function startGame() {
        breakSound.load();
        bgm.play().catch(e => console.log("BGM 재생 대기"));
        document.getElementById('startScreen').style.display = 'none';
        running = true;
        lastTime = performance.now();
        requestAnimationFrame(gameLoop);
    }

        var clientX = e.touches ? e.touches[0].clientX : e.clientX;
        mouseX = clientX - rect.left;
    }
    canvas.addEventListener("mousemove", movePaddle);
    canvas.addEventListener("touchmove", movePaddle, { passive: false });
