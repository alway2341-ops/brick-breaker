<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>벽돌 깨기 - 로직 검증용 코드</title>
    <style>
        body { margin: 0; background: #222; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        canvas { background: #f0f0f0; border: 4px solid #333; display: block; }
        #startScreen { position: absolute; background: rgba(0,0,0,0.8); color: white; padding: 20px; cursor: pointer; border-radius: 10px; z-index: 10; font-family: sans-serif; }
    </style>
</head>
<body>
    <div id="startScreen"><h1>클릭하여 게임 시작</h1></div>
    <canvas id="myCanvas" width="480" height="400"></canvas>

    <script>
        // 캔버스 및 기본 변수 설정
        const canvas = document.getElementById("myCanvas");
        const ctx = canvas.getContext("2d");
        
        let balls = [{ x: 240, y: 100, dx: 2, dy: 3, radius: 8 }];
        let bricks = [];
        let particles = [];
        let score = 0;
        let running = false;
        let paddleX = 190;
        let paddleWidth = 100;
        let blockBaseSpeed = 1.2;

        // 오디오 객체 설정 (파일 에러 방지)
        const breakSound = new Audio('break.wav');
        const bgm = new Audio('bgm.wav');
        bgm.loop = true;

        // 클릭 이벤트: 게임 시작
        document.getElementById('startScreen').addEventListener('click', function() {
            this.style.display = 'none';
            bgm.play().catch(e => console.log("오디오 재생 실패"));
            running = true;
            gameLoop();
        });

        // 패들 이동 이벤트
        canvas.addEventListener("mousemove", (e) => { 
            const rect = canvas.getBoundingClientRect();
            paddleX = (e.clientX - rect.left) - paddleWidth / 2;
        });

        // 파티클 생성 함수
        function createParticles(x, y, color) {
            for(let i = 0; i < 15; i++) {
                particles.push({ 
                    x: x, y: y, 
                    dx: (Math.random() - 0.5) * 6, 
                    dy: (Math.random() - 0.5) * 6, 
                    radius: 2, 
                    color: color, 
                    life: 20 
                });
            }
        }

        // 게임 루프
        function gameLoop() {
            if (!running) return;
            ctx.clearRect(0, 0, 480, 400);

            // 1. 속도 증가 로직 (30점 단위)
            blockBaseSpeed = 1.2 + Math.floor(score / 30) * 0.3;

            // 2. 블록 생성 로직
            if (Math.random() < 0.02) {
                let r = Math.random();
                let type = (score >= 50 && r < 0.1) ? 5 : (r < 0.2 ? 2 : (r < 0.4 ? 1 : 0));
                bricks.push({ x: Math.random() * 420, y: 0, type: type, speed: blockBaseSpeed });
            }

            // 3. 블록 그리기 및 충돌 판정
            let toRemove = [];
            for (let i = 0; i < bricks.length; i++) {
                let b = bricks[i];
                b.y += b.speed;
                
                // 블록 색상 설정
                if (b.type === 5) ctx.fillStyle = "#87CEEB";
                else if (b.type === 2) ctx.fillStyle = "black";
                else if (b.type === 1) ctx.fillStyle = "#2ecc71";
                else ctx.fillStyle = "#e74c3c";
                
                ctx.fillRect(b.x, b.y, 50, 20);

                // 공과의 정밀 충돌 판정
                balls.forEach(ball => {
                    let closestX = Math.max(b.x, Math.min(ball.x, b.x + 50));
                    let closestY = Math.max(b.y, Math.min(ball.y, b.y + 20));
                    let distance = Math.hypot(ball.x - closestX, ball.y - closestY);

                    if (distance < ball.radius) {
                        // 모서리 반사 로직 (충돌 면 판정)
                        if (Math.abs(ball.x - closestX) > Math.abs(ball.y - closestY)) {
                            ball.dx = -ball.dx;
                        } else {
                            ball.dy = -ball.dy;
                        }
                        
                        // 블록 타입별 효과
                        if (b.type === 5) {
                            ball.dx = (Math.random() - 0.5) * 10;
                        } else if (b.type === 2) {
                            bricks = bricks.filter(br => Math.hypot(br.x - b.x, br.y - b.y) > 80);
                            createParticles(b.x + 25, b.y + 10, "#555");
                        } else if (b.type === 1) {
                            balls.push({ x: ball.x, y: ball.y, dx: -ball.dx, dy: -ball.dy, radius: 8 });
                            toRemove.push(i);
                            createParticles(b.x + 25, b.y + 10, "#2ecc71");
                        } else {
                            toRemove.push(i);
                            createParticles(b.x + 25, b.y + 10, "#e74c3c");
                        }
                        
                        score++;
                        breakSound.currentTime = 0; 
                        breakSound.play().catch(e => {});
                    }
                });
            }
            toRemove.sort((a,b) => b-a).forEach(i => bricks.splice(i, 1));

            // 4. 파티클 업데이트
            particles.forEach((p, i) => {
                p.x += p.dx; p.y += p.dy; p.life--;
                if (p.life <= 0) particles.splice(i, 1);
                else {
                    ctx.beginPath(); 
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); 
                    ctx.fillStyle = p.color; 
                    ctx.fill();
                }
            });

            // 5. 공 이동 및 벽 충돌
            balls.forEach(ball => {
                ball.x += ball.dx;
                ball.y += ball.dy;
                if (ball.x < 0 || ball.x > 480) ball.dx = -ball.dx;
                if (ball.y < 0) ball.dy = -ball.dy;
                
                // 패들 충돌
                if (ball.y > 380 && ball.x > paddleX && ball.x < paddleX + paddleWidth) {
                    ball.dx = ((ball.x - (paddleX + paddleWidth / 2)) / (paddleWidth / 2)) * 5;
                    ball.dy = -Math.abs(ball.dy);
                    ball.y = 380;
                }
                
                ctx.beginPath(); 
                ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2); 
                ctx.fillStyle = "gold"; 
                ctx.fill();
            });

            // 게임 오버 조건
            if (balls.length === 0) {
                running = false;
                alert("Game Over! Score: " + score);
                location.reload();
            }

            ctx.fillStyle = "black";
            ctx.fillText("Score: " + score, 10, 20);
            ctx.fillStyle = "#34495e";
            ctx.fillRect(paddleX, 390, paddleWidth, 10);
            
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
