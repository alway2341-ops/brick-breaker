<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>벽돌 깨기 - 최종 통합본</title>
    <style>
        body { margin: 0; background: #222; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        canvas { background: #f0f0f0; border: 4px solid #333; display: block; }
        #startScreen { position: absolute; background: rgba(0,0,0,0.8); color: white; padding: 20px; cursor: pointer; border-radius: 10px; z-index: 10; font-family: sans-serif; }
    </style>
</head>
<body>
    <div id="startScreen"><h1>클릭하여 게임 시작</h1></div>
    <canvas id="myCanvas" width="480" height="400"></canvas>

    <script>
        const canvas = document.getElementById("myCanvas");
        const ctx = canvas.getContext("2d");
        
        // 오디오 로드 및 자동 프리로드
        const breakSound = new Audio('break.wav');
        const bgm = new Audio('bgm.wav');
        bgm.loop = true;

        let balls = [], bricks = [], score = 0, running = false;
        let paddleX = 190, paddleWidth = 100;
        const heavyBlock = { x: 190, y: 30, w: 100, h: 20 };

        document.getElementById('startScreen').addEventListener('click', function() {
            this.style.display = 'none';
            // 사용자 상호작용 후 오디오 강제 재생
            bgm.play().catch(e => console.log("BGM 재생 대기"));
            
            balls = [{ x: 240, y: 100, dx: 2, dy: 3, radius: 8 }];
            bricks = []; score = 0; running = true;
            requestAnimationFrame(gameLoop);
        });

        canvas.addEventListener("mousemove", (e) => { 
            const rect = canvas.getBoundingClientRect();
            paddleX = Math.max(0, Math.min(480 - paddleWidth, (e.clientX - rect.left) - paddleWidth/2));
        });

        function gameLoop() {
            if (!running) return;
            ctx.clearRect(0, 0, 480, 400);

            // 1. 점수 50점 이상 시 하늘색 블록 고정 생성
            if (score >= 50) {
                ctx.fillStyle = "#87CEEB";
                ctx.fillRect(heavyBlock.x, heavyBlock.y, heavyBlock.w, heavyBlock.h);
            }

            // 2. 일반 블록 생성
            if (Math.random() < 0.02) {
                bricks.push({ x: Math.random() * 420, y: 0, type: Math.floor(Math.random() * 3), speed: 1.2 });
            }

            // 3. 충돌 로직
            let toRemove = [];
            bricks.forEach((b, i) => {
                b.y += b.speed;
                ctx.fillStyle = b.type === 2 ? "black" : (b.type === 1 ? "#2ecc71" : "#e74c3c");
                ctx.fillRect(b.x, b.y, 50, 20);

                balls.forEach(ball => {
                    if (ball.x > b.x && ball.x < b.x + 50 && ball.y > b.y && ball.y < b.y + 20) {
                        breakSound.currentTime = 0;
                        breakSound.play().catch(e => {});
                        ball.dy = -ball.dy;
                        toRemove.push(i);
                        score++;
                    }
                });
            });
            toRemove.sort((a,b) => b-a).forEach(i => bricks.splice(i, 1));

            // 4. 공 및 하늘색 블록 판정
            balls = balls.filter(ball => {
                ball.x += ball.dx; ball.y += ball.dy;
                
                // 하늘색 블록 충돌 (속도 증가)
                if (score >= 50 && ball.x > heavyBlock.x && ball.x < heavyBlock.x + heavyBlock.w && 
                    ball.y > heavyBlock.y && ball.y < heavyBlock.y + heavyBlock.h) {
                    ball.dx *= 1.1; ball.dy *= 1.1; ball.dy = -ball.dy;
                }

                if (ball.x < 0 || ball.x > 480) ball.dx *= -1;
                if (ball.y < 0) ball.dy *= -1;
                if (ball.y > 380 && ball.x > paddleX && ball.x < paddleX + paddleWidth) {
                    ball.dy = -Math.abs(ball.dy);
                    ball.y = 380;
                }
                ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI*2); ctx.fillStyle = "gold"; ctx.fill();
                return ball.y < 400;
            });

            if (balls.length === 0) { running = false; bgm.pause(); alert("Game Over! Score: " + score); location.reload(); }

            ctx.fillStyle = "black"; ctx.fillText("Score: " + score, 10, 20);
            ctx.fillStyle = "#34495e"; ctx.fillRect(paddleX,
