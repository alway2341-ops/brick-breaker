<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>벽돌 깨기 게임</title>
    <style>
        body { margin: 0; background: #222; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; touch-action: none; }
        #gameContainer { position: relative; width: 100vw; max-width: 480px; height: 400px; }
        canvas { background: #f0f0f0; border: 4px solid #333; display: block; width: 100%; height: 100%; cursor: none; }
        #startScreen { position: absolute; top:0; left:0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; z-index: 10; }
        button { padding: 15px 30px; font-size: 20px; cursor: pointer; border-radius: 8px; border: none; z-index: 11; }
    </style>
</head>
<body>
<div id="gameContainer">
    <canvas id="myCanvas" width="480" height="400"></canvas>
    <div id="startScreen">
        <h1>벽돌 깨기</h1>
        <button id="startBtn">게임 시작</button>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        var canvas = document.getElementById("myCanvas"), ctx = canvas.getContext("2d");
        var paddleWidth = 100, paddleX = 190, mouseX = 240, running = false;
        var balls = [{ x: 240, y: 370, dx: 1.8, dy: -1.8, radius: 8, baseRadius: 8 }];
        var bricks = [], particles = [], score = 0, lastTime = 0, flash = 0;

        var breakSound = new Audio('break.wav');
        var bgm = new Audio('bgm.wav');
        bgm.loop = true;

        function createParticles(x, y, color) {
            for(let i = 0; i < 15; i++) {
                particles.push({ x: x, y: y, dx: (Math.random()-0.5)*6, dy: (Math.random()-0.5)*6, radius: Math.random()*2+1, color: color, life: 20 });
            }
        }

        document.getElementById('startBtn').addEventListener('click', function() {
            bgm.play().catch(e => console.log("BGM 대기"));
            document.getElementById('startScreen').style.display = 'none';
            running = true;
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        });

        canvas.addEventListener("mousemove", (e) => { 
            var rect = canvas.getBoundingClientRect();
            mouseX = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
        });

        function gameLoop(timestamp) {
            if(!running) return;
            var deltaTime = (timestamp - lastTime) / 16.67;
            lastTime = timestamp;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if(flash > 0) { ctx.fillStyle = "rgba(0,0,0,0.3)"; ctx.fillRect(0,0,480,400); flash--; }
            
            paddleX = mouseX - paddleWidth/2;
            ctx.fillStyle = "#34495e";
            ctx.fillRect(paddleX, 390, paddleWidth, 10);

            if(Math.random() < 0.015) {
                let type = Math.random() < 0.1 ? 2 : (Math.random() < 0.3 ? 1 : 0);
                if(score >= 50 && Math.random() < 0.1) type = 5; 
                bricks.unshift({ x: Math.random() * 420, y: 0, type: type, speed: 0.5 + Math.random() * 0.5, passed: false });
            }

            bricks.forEach((b, i) => {
                b.y += 1 * b.speed * deltaTime;
                let color = b.type === 5 ? "rgba(52, 152, 219, 0.5)" : (b.type === 2 ? "black" : (b.type === 1 ? "#2ecc71" : "#e74c3c"));
                ctx.fillStyle = color;
                ctx.fillRect(b.x, b.y, 50, 20);
                
                balls.forEach(ball => {
                    if(ball.x > b.x && ball.x < b.x+50 && ball.y > b.y && ball.y < b.y+20) {
                        if(b.type === 2) { 
                            bricks = bricks.filter(br => Math.hypot(br.x - b.x, br.y - b.y) > 80);
                            flash = 10; createParticles(b.x+25, b.y+10, "#555");
                        } else if(b.type === 5) {
                            if(!b.passed) { ball.dx *= 1.5; b.passed = true; }
                        } else {
                            breakSound.currentTime = 0; breakSound.play().catch(e => {});
                            createParticles(b.x+25, b.y+10, color);
                            ball.dy = -ball.dy; bricks.splice(i, 1); score++;
                        }
                    }
                });
                if(b.y > 400) { running = false; bgm.pause(); alert("Game Over! Score: " + score); location.reload(); }
            });

            particles.forEach((p, i) => {
                p.x += p.dx * deltaTime; p.y += p.dy * deltaTime; p.life -= deltaTime;
                if (p.life <= 0) particles.splice(i, 1);
                else { ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2); ctx.fillStyle = p.color; ctx.fill(); }
            });

            balls.forEach((ball, i) => {
                ball.x += ball.dx * deltaTime; ball.y += ball.dy * deltaTime;
                if(ball.x > 470 || ball.x < 10) ball.dx = -ball.dx;
                if(ball.y < 10) ball.dy = -ball.dy;
                if(ball.y > 385 && ball.x > paddleX && ball.x < paddleX + paddleWidth) ball.dy = -Math.abs(ball.dy);
                ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI*2); ctx.fillStyle = "gold"; ctx.fill();
            });

            ctx.fillStyle = "black"; ctx.fillText("Score: " + score, 10, 20);
            requestAnimationFrame(gameLoop);
        }
    });
</script>
</body>
</html>
