<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>벽돌 깨기 게임</title>
    <style>
        body { margin: 0; background: #222; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; touch-action: none; }
        #gameContainer { position: relative; width: 100vw; max-width: 480px; height: 400px; }
        canvas { background: #f0f0f0; border: 4px solid #333; display: block; width: 100%; height: 100%; cursor: none; }
        #startScreen { position: absolute; top:0; left:0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; z-index: 10; }
        button { padding: 15px 30px; font-size: 20px; cursor: pointer; border-radius: 8px; border: none; z-index: 11; }
    </style>
</head>
<body>
<div id="gameContainer">
    <canvas id="myCanvas" width="480" height="400"></canvas>
    <div id="startScreen">
        <h1>벽돌 깨기</h1>
        <button id="startBtn">게임 시작</button>
    </div>
</div>

<script>
    var canvas = document.getElementById("myCanvas"), ctx = canvas.getContext("2d");
    var paddleWidth = 100, paddleX = 190, mouseX = 240, running = false;
    var balls = [], bricks = [], particles = [], score = 0, lastTime = 0;
    var breakSound = new Audio('break.wav');
    var bgm = new Audio('bgm.wav'); bgm.loop = true;

    function createParticles(x, y, color) {
        for(let i = 0; i < 15; i++) {
            particles.push({ x: x, y: y, dx: (Math.random()-0.5)*6, dy: (Math.random()-0.5)*6, radius: Math.random()*2+1, color: color, life: 20 });
        }
    }

    document.getElementById('startBtn').addEventListener('click', function() {
        bgm.play().catch(e => console.log("BGM 재생 대기"));
        document.getElementById('startScreen').style.display = 'none';
        balls = [{ x: 240, y: 370, dx: 1.8, dy: -1.8, radius: 8 }];
        bricks = []; particles = []; score = 0; running = true;
        lastTime = performance.now();
        requestAnimationFrame(gameLoop);
    });

    canvas.addEventListener("mousemove", (e) => { 
        var rect = canvas.getBoundingClientRect();
        mouseX = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    });

    function gameLoop(timestamp) {
        if(!running) return;
        var deltaTime = (timestamp - lastTime) / 16.67;
        lastTime = timestamp;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        paddleX = mouseX - paddleWidth/2;
        ctx.fillStyle = "#34495e";
        ctx.fillRect(paddleX, 390, paddleWidth, 10);

        if(Math.random() < 0.015) {
            let type = Math.random() < 0.1 ? 2 : (Math.random() < 0.3 ? 1 : 0);
            bricks.unshift({ x: Math.random() * 420, y: 0, type: type, speed: 0.5 + Math.random() * 0.5 });
        }

        let toRemoveBricks = [];
        bricks.forEach((b, i) => {
            b.y += 1 * b.speed * deltaTime;
            let color = b.type === 2 ? "black" : (b.type === 1 ? "#2ecc71" : "#e74c3c");
            ctx.fillStyle = color; ctx.fillRect(b.x, b.y, 50, 20);
            
            balls.forEach(ball => {
                let closestX = Math.max(b.x, Math.min(ball.x, b.x + 50));
                let closestY = Math.max(b.y, Math.min(ball.y, b.y + 20));
                if (((ball.x - closestX)**2 + (ball.y - closestY)**2) <= ball.radius**2) {
                    if (b.type === 2) { 
                        bricks = bricks.filter(br => Math.hypot(br.x - b.x, br.y - b.y) > 80);
                        createParticles(b.x+25, b.y+10, "#555");
                    } else if (b.type === 1) {
                        balls.push({ x: ball.x, y: ball.y, dx: -ball.dx, dy: -ball.dy, radius: 8 });
                        toRemoveBricks.push(i); score++; createParticles(b.x+25, b.y+10, color);
                    } else {
                        ball.dy = -ball.dy; toRemoveBricks.push(i); score++; createParticles(b.x+25, b.y+10, color);
                    }
                }
            });
        });
        toRemoveBricks.sort((a,b) => b-a).forEach(i => bricks.splice(i, 1));

        particles.forEach((p, i) => {
            p.x += p.dx; p.y += p.dy; p.life--;
            if (p.life <= 0) particles.splice(i, 1);
            else { ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2); ctx.fillStyle = p.color; ctx.fill(); }
        });

        // 공 처리 로직: 배열에서 직접 삭제하지 않고 필터링 사용
        balls = balls.filter(ball => {
            ball.x += ball.dx; ball.y += ball.dy;
            if(ball.x > 470 || ball.x < 10) ball.dx = -ball.dx;
            if(ball.y < 10) ball.dy = -ball.dy;
            if(ball.y > 385 && ball.x > paddleX && ball.x < paddleX + paddleWidth) ball.dy = -Math.abs(ball.dy);
            ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI*2); ctx.fillStyle = "gold"; ctx.fill();
            return ball.y < 450;
        });

        // 게임 오버 조건: 공이 하나도 없을 때만 발동
        if(balls.length === 0) { 
            running = false; bgm.pause(); 
            alert("Game Over! Final Score: " + score); 
            location.reload(); 
        }

        ctx.fillStyle = "black"; ctx.fillText("Score: " + score, 10, 20);
        requestAnimationFrame(gameLoop);
    }
</script>
</body>
</html>
