<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>벽돌 깨기 - 최종 통합본</title>
    <style>
        body { margin: 0; background: #222; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        canvas { background: #f0f0f0; border: 4px solid #333; display: block; }
        #startScreen { position: absolute; background: rgba(0,0,0,0.8); color: white; padding: 20px; cursor: pointer; border-radius: 10px; z-index: 10; font-family: sans-serif; }
    </style>
</head>
<body>
    <div id="startScreen"><h1>클릭하여 게임 시작</h1></div>
    <canvas id="myCanvas" width="480" height="400"></canvas>

    <script>
        const canvas = document.getElementById("myCanvas");
        const ctx = canvas.getContext("2d");

        const loadAudio = (src) => {
            try { return new Audio(src); } catch(e) { return { play: () => {}, pause: () => {}, currentTime: 0 }; }
        };
        const breakSound = loadAudio('break.wav');
        const bgm = loadAudio('bgm.wav'); bgm.loop = true;

        let balls = [{ x: 240, y: 100, dx: 2, dy: 3, radius: 8 }];
        let bricks = [];
        let particles = [];
        let score = 0;
        let running = false;
        let paddleX = 190;
        let paddleWidth = 100;
        let blockBaseSpeed = 1.2;

        document.getElementById('startScreen').addEventListener('click', function() {
            this.style.display = 'none';
            bgm.play().catch(e => {});
            running = true;
            gameLoop();
        });

        canvas.addEventListener("mousemove", (e) => { 
            const rect = canvas.getBoundingClientRect();
            paddleX = (e.clientX - rect.left) - paddleWidth / 2;
        });

        function createParticles(x, y, color) {
            for(let i = 0; i < 15; i++) {
                particles.push({ x, y, dx: (Math.random()-0.5)*6, dy: (Math.random()-0.5)*6, radius: 2, color, life: 20 });
            }
        }

        function gameLoop() {
            if (!running) return;
            ctx.clearRect(0, 0, 480, 400);

            // 속도 가속 (상한선 없음)
            blockBaseSpeed = 1.2 + Math.floor(score / 30) * 0.3;

            // 1. 블록 생성 로직 (300점 노란색 블록 추가)
            if (Math.random() < 0.02) {
                let r = Math.random();
                let type = 0;
                
                if (score >= 300 && r < 0.05) type = 6; // 노란색 (회전)
                else if (score >= 50 && r < 0.15) type = 5; // 하늘색
                else if (r < 0.25) type = 2; // 검정색
                else if (r < 0.45) type = 1; // 초록색

                let b = { x: Math.random() * 420, y: 0, type: type, speed: blockBaseSpeed };
                
                // 노란색 블록 전용 변수 (회전)
                if (type === 6) {
                    b.rotAngle = 0;
                    b.rotRadius = 50 + Math.random() * 100; // 회전 반경
                    b.center = { x: Math.random() * 400 + 40, y: Math.random() * 100 + 30 }; // 회전 중심
                }
                bricks.push(b);
            }

            // 2. 블록 업데이트 및 정밀 충돌 판정
            let toRemove = [];
            for (let i = 0; i < bricks.length; i++) {
                let b = bricks[i];
                
                // 노란색 블록은 회전, 나머지는 직진
                if (b.type === 6) {
                    b.rotAngle += 0.02 * b.speed;
                    b.x = b.center.x + Math.cos(b.rotAngle) * b.rotRadius;
                    b.y = b.center.y + Math.sin(b.rotAngle) * b.rotRadius;
                } else {
                    b.y += b.speed;
                }
                
                // 블록 색상 설정
                if (b.type === 6) ctx.fillStyle = "gold"; // 노란색
                else if (b.type === 5) ctx.fillStyle = "#87CEEB";
                else if (b.type === 2) ctx.fillStyle = "black";
                else if (b.type === 1) ctx.fillStyle = "#2ecc71";
                else ctx.fillStyle = "#e74c3c";
                
                ctx.fillRect(b.x, b.y, 50, 20);

                balls.forEach(ball => {
                    let closestX = Math.max(b.x, Math.min(ball.x, b.x + 50));
                    let closestY = Math.max(b.y, Math.min(ball.y, b.y + 20));
                    let distance = Math.hypot(ball.x - closestX, ball.y - closestY);

                    if (distance < ball.radius) {
                        // 모서리 반사 로직
                        if (Math.abs(ball.x - closestX) > Math.abs(ball.y - closestY)) ball.dx = -ball.dx;
                        else ball.dy = -ball.dy;
                        
                        // 블록 타입별 효과
                        if (b.type === 6) { // 노란색 충돌 (점수 대폭 증가 + 강력한 파티클)
                            createParticles(b.x + 25, b.y + 10, "gold");
                            score += 5; toRemove.push(i);
                        } else if (b.type === 5) ball.dx = (Math.random() - 0.5) * 10;
                        else if (b.type === 2) {
                            bricks = bricks.filter(br => Math.hypot(br.x - b.x, br.y - b.y) > 80);
                            createParticles(b.x + 25, b.y + 10, "#555");
                        } else if (b.type === 1) {
                            balls.push({ x: ball.x, y: ball.y, dx: -ball.dx, dy: -ball.dy, radius: 8 });
                            toRemove.push(i); createParticles(b.x + 25, b.y + 10, "#2ecc71");
                        } else {
                            toRemove.push(i); createParticles(b.x + 25, b.y + 10, "#e74c3c");
                        }
                        
                        if (b.type !== 6) score++;
                        breakSound.currentTime = 0; breakSound.play().catch(e => {});
                    }
                });
            }
            toRemove.sort((a,b) => b-a).forEach(i => bricks.splice(i, 1));
