<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>벽돌 깨기 - 최종 통합본</title>
    <style>
        body { margin: 0; background: #222; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        canvas { background: #f0f0f0; border: 4px solid #333; display: block; }
        #startScreen { position: absolute; background: rgba(0,0,0,0.8); color: white; padding: 20px; cursor: pointer; border-radius: 10px; z-index: 10; font-family: sans-serif; }
    </style>
</head>
<body>
    <div id="startScreen"><h1>클릭하여 게임 시작</h1></div>
    <canvas id="myCanvas" width="480" height="400"></canvas>

    <script>
        const canvas = document.getElementById("myCanvas");
        const ctx = canvas.getContext("2d");
        const breakSound = new Audio('break.wav');
        const bgm = new Audio('bgm.wav'); bgm.loop = true;

        let balls = [], bricks = [], particles = [], score = 0, running = false;
        let paddleX = 190, paddleWidth = 100;

        function createParticles(x, y, color) {
            for(let i = 0; i < 15; i++) {
                particles.push({ x, y, dx: (Math.random()-0.5)*6, dy: (Math.random()-0.5)*6, radius: 2, color, life: 20 });
            }
        }

        document.getElementById('startScreen').addEventListener('click', function() {
            this.style.display = 'none';
            bgm.play().catch(e => {});
            balls = [{ x: 240, y: 100, dx: 2, dy: 3, radius: 8 }];
            bricks = []; particles = []; score = 0; running = true;
            requestAnimationFrame(gameLoop);
        });

        canvas.addEventListener("mousemove", (e) => { 
            const rect = canvas.getBoundingClientRect();
            paddleX = Math.max(0, Math.min(480 - paddleWidth, (e.clientX - rect.left) - paddleWidth/2));
        });

        function gameLoop() {
            if (!running) return;
            ctx.clearRect(0, 0, 480, 400);

            // 1. 블록 생성
            if (Math.random() < 0.02) {
                let r = Math.random();
                let type = (score >= 50 && r < 0.1) ? 5 : (r < 0.2 ? 2 : (r < 0.4 ? 1 : 0));
                bricks.push({ x: Math.random() * 420, y: 0, type, speed: 1.2 });
            }

            // 2. 블록 이동 및 충돌
            let toRemove = [];
            bricks.forEach((b, i) => {
                b.y += b.speed;
                ctx.fillStyle = b.type === 5 ? "#87CEEB" : (b.type === 2 ? "black" : (b.type === 1 ? "#2ecc71" : "#e74c3c"));
                ctx.fillRect(b.x, b.y, 50, 20);

                balls.forEach(ball => {
                    if (ball.x > b.x && ball.x < b.x + 50 && ball.y > b.y && ball.y < b.y + 20) {
                        if (b.type === 5) { // 하늘색: 무작위 튕김
                            ball.dx = (Math.random() - 0.5) * 10;
                            ball.dy = -ball.dy;
                        } else if (b.type === 2) { // 검정: 원형 범위 파괴
                            bricks = bricks.filter(br => Math.hypot(br.x - b.x, br.y - b.y) > 80);
                            createParticles(b.x+25, b.y+10, "#555");
                        } else if (b.type === 1) { // 초록: 공 추가
                            balls.push({ x: ball.x, y: ball.y, dx: -ball.dx, dy: -ball.dy, radius: 8 });
                            toRemove.push(i); createParticles(b.x+25, b.y+10, "#2ecc71");
                        } else { // 기본: 점수
                            ball.dy = -ball.dy; toRemove.push(i); createParticles(b.x+25, b.y+10, "#e74c3c");
                        }
                        if (b.type !== 2) score++;
                        breakSound.currentTime = 0; breakSound.play().catch(e => {});
                    }
                });
            });
            toRemove.sort((a,b) => b-a).forEach(i => bricks.splice(i, 1));

            // 3. 파티클 및 공 로직
            particles.forEach((p, i) => {
                p.x += p.dx; p.y += p.dy; p.life--;
                if (p.life <= 0) particles.splice(i, 1);
                else { ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2); ctx.fillStyle = p.color; ctx.fill(); }
            });

            balls = balls.filter(ball => {
                ball.x += ball.dx; ball.y += ball.dy;
                if (ball.x < 0 || ball.x > 480) ball.dx *= -1;
                if (ball.y < 0) ball.dy *= -1;
                if (ball.y > 380 && ball.x > paddleX && ball.x < paddleX + paddleWidth) {
                    ball.dx = ((ball.x - (paddleX + paddleWidth/2)) / (paddleWidth/2)) * 5;
                    ball.dy = -Math.abs(ball.dy);
                }
                ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI*2); ctx.fillStyle = "gold"; ctx.fill();
                return ball.y < 400;
            });

            if (balls.length === 0) { running = false; alert("Game Over! Score: " + score); location.reload(); }
            ctx.fillStyle = "black"; ctx.fillText("Score: " + score, 10, 20);
            ctx.fillRect(paddleX, 390, paddleWidth, 10);
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
