<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>벽돌 깨기 - 최종 완전판</title>
    <style>
        body { margin: 0; background: #222; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        canvas { background: #f0f0f0; border: 4px solid #333; display: block; }
        #startScreen { position: absolute; background: rgba(0,0,0,0.8); color: white; padding: 20px; cursor: pointer; border-radius: 10px; z-index: 10; font-family: sans-serif; }
    </style>
</head>
<body>
    <div id="startScreen"><h1>클릭하여 게임 시작</h1></div>
    <canvas id="myCanvas" width="480" height="400"></canvas>

    <script>
        const canvas = document.getElementById("myCanvas");
        const ctx = canvas.getContext("2d");

        // 오디오 로딩 (에러 방지)
        const loadAudio = (src) => {
            try { return new Audio(src); } catch(e) { return { play: () => {}, pause: () => {}, currentTime: 0 }; }
        };
        const breakSound = loadAudio('break.wav');
        const bgm = loadAudio('bgm.wav'); bgm.loop = true;

        // 전역 변수
        let balls = [], bricks = [], particles = [], score = 0, running = false, paddleX = 190, paddleWidth = 100, blockBaseSpeed = 1.2;

        // 1. 게임 상태 초기화 함수 (시작 오류 방지 핵심)
        function initGame() {
            score = 0;
            balls = [{ x: 240, y: 100, dx: 2, dy: 3, radius: 8 }];
            bricks = [];
            particles = [];
            paddleX = 190;
            blockBaseSpeed = 1.2;
            running = true;
        }

        // 2. 이벤트 리스너
        document.getElementById('startScreen').addEventListener('click', function() {
            if (running) return; // 이미 실행 중이면 무시
            this.style.display = 'none';
            bgm.play().catch(e => {});
            initGame(); // 확실한 초기화
            gameLoop(); // 루프 시작
        });

        canvas.addEventListener("mousemove", (e) => { 
            const rect = canvas.getBoundingClientRect();
            paddleX = Math.max(0, Math.min(480 - paddleWidth, (e.clientX - rect.left) - paddleWidth / 2));
        });

        function createParticles(x, y, color) {
            for(let i = 0; i < 15; i++) {
                particles.push({ x, y, dx: (Math.random()-0.5)*6, dy: (Math.random()-0.5)*6, radius: 2, color, life: 20 });
            }
        }

        // 3. 게임 메인 루프
        function gameLoop() {
            if (!running) return;
            ctx.clearRect(0, 0, 480, 400);

            blockBaseSpeed = 1.2 + Math.floor(score / 30) * 0.3;

            // 블록 생성
            if (Math.random() < 0.02) {
                let r = Math.random();
                let type = 0;
                if (score >= 300 && r < 0.05) type = 6; // 노란색(회전)
                else if (score >= 50 && r < 0.15) type = 5;
                else if (r < 0.25) type = 2;
                else if (r < 0.45) type = 1;

                let b = { x: Math.random() * 420, y: 0, type: type, speed: blockBaseSpeed };
                if (type === 6) { b.rotAngle = 0; b.rotRadius = 50 + Math.random() * 100; b.center = { x: Math.random() * 400 + 40, y: Math.random() * 100 + 30 }; }
                bricks.push(b);
            }

            // 블록 업데이트 및 충돌
            let toRemove = [];
            for (let i = 0; i < bricks.length; i++) {
                let b = bricks[i];
                if (b.type === 6) { b.rotAngle += 0.02 * b.speed; b.x = b.center.x + Math.cos(b.rotAngle) * b.rotRadius; b.y = b.center.y + Math.sin(b.rotAngle) * b.rotRadius; }
                else { b.y += b.speed; }
                
                ctx.fillStyle = b.type === 6 ? "gold" : (b.type === 5 ? "#87CEEB" : (b.type === 2 ? "black" : (b.type === 1 ? "#2ecc71" : "#e74c3c")));
                ctx.fillRect(b.x, b.y, 50, 20);

                balls.forEach(ball => {
                    let closestX = Math.max(b.x, Math.min(ball.x, b.x + 50));
                    let closestY = Math.max(b.y, Math.min(ball.y, b.y + 20));
                    if (Math.hypot(ball.x - closestX, ball.y - closestY) < ball.radius) {
                        if (Math.abs(ball.x - closestX) > Math.abs(ball.y - closestY)) ball.dx = -ball.dx;
                        else ball.dy = -ball.dy;
                        
                        if (b.type === 6) { createParticles(b.x + 25, b.y + 10, "gold"); score += 5; toRemove.push(i); }
                        else if (b.type === 5) ball.dx = (Math.random() - 0.5) * 10;
                        else if (b.type === 2) { 
                            let before = bricks.length;
                            bricks = bricks.filter(br => Math.hypot(br.x - b.x, br.y - b.y) > 80);
                            score += (before - bricks.length);
                            createParticles(b.x + 25, b.y + 10, "#555");
                        } else if (b.type === 1) { balls.push({ x: ball.x, y: ball.y, dx: -ball.dx, dy: -ball.dy, radius: 8 }); toRemove.push(i); createParticles(b.x + 25, b.y + 10, "#2ecc71"); score++; }
                        else { toRemove.push(i); createParticles(b.x + 25, b.y + 10, "#e74c3c"); score++; }
                        
                        breakSound.currentTime = 0; breakSound.play().catch(e => {});
                    }
                });
            }
            toRemove.sort((a,b) => b-a).forEach(i => bricks.splice(i, 1));

            // 파티클 업데이트
            particles.forEach((p, i) => { p.x += p.dx; p.y += p.dy; p.life--; if (p.life <= 0) particles.splice(i, 1); else { ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fillStyle = p.color; ctx.fill(); } });

            // 공 업데이트 및 패들 충돌
            balls.forEach(ball => {
                ball.x += ball.dx; ball.y += ball.dy;
                if (ball.x < 0 || ball.x > 480) ball.dx = -ball.dx;
                if (ball.y < 0) ball.dy = -ball.dy;
                if (ball.dy > 0 && ball.y > 380 && ball.y < 390 && ball.x > paddleX && ball.x < paddleX + paddleWidth) {
                    let mult = 1 + Math.floor(score / 30) * 0.1;
                    ball.dx = ((ball.x - (paddleX + paddleWidth / 2)) / (paddleWidth / 2)) * 5 * mult;
                    ball.dy = -Math.abs(ball.dy) * mult;
                    ball.y = 380 - ball.radius;
                }
                ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2); ctx.fillStyle = "gold"; ctx.fill();
            });

            if (balls.length === 0) { running = false; alert("Game Over! Score: " + score); document.getElementById('startScreen').style.display = 'block'; }
            else { ctx.fillStyle = "black"; ctx.fillText("Score: " + score, 10, 20); ctx.fillRect(paddleX, 390, paddleWidth, 10); requestAnimationFrame(gameLoop); }
        }
    </script>
</body>
</html>
